# matrix-archivist configuration. Copy to config.yaml and edit.

matrix:
  homeserver: https://matrix.example.org
  user_id: "@archivist:example.org"

  # Authentication — choose ONE:
  # (a) Password (recommended): the bot logs in and keeps its E2EE device in crypto.db.
  password: "change-me"
  # (b) Access token + the device ID it belongs to (needed for end-to-end encryption).
  access_token: ""
  device_id: ""

  # The single room the bot listens and writes to (room ID, not alias). Invite the bot; it auto-joins.
  room_id: "!abcdefghijkl:example.org"
  # Optional: servers already in the room, used to join it. Normally detected from the invite.
  # room_via: [example.org]
  # Secret used to encrypt the E2EE keys at rest. Never change it after first start.
  pickle_key: "generate-a-long-random-string"
  display_name: Archivist

# Base command. Examples: !archivist, !bot, !cloner
command_prefix: "!archivist"

# Minimum room power level for add / remove / refresh (0 = everyone, 50 = moderators, 100 = admins).
# add, remove, refresh, note, tag, untag and import need it; everything else is open to everyone.
min_power_level: 50

storage_dir: /data/repos
database: /data/archivist.db
crypto_database: /data/crypto.db

check_interval: 1h        # how often every repo is checked for updates (>= 1m)
concurrency: 3            # repos checked in parallel
git_timeout: 30m          # per clone/fetch
# After this many consecutive failed checks of a repo, post an @room alert (0 = off).
# The bot needs the room's "notify everyone" power level (default 50) for @room to ping.
failure_alert_threshold: 5
# Delete branches/tags locally when they are deleted upstream. false = keep them (safer for an archive).
# Either way, anything upstream rewrites or deletes is first preserved under refs/archive/<time>/.
prune_deleted: false
# Post an @room alert when free space in storage_dir drops below this (0 = off).
disk_warn_free: 5GB
# Forge APIs and release downloads may not connect to internal addresses (127.0.0.1, 10.x,
# 192.168.x, 169.254.x, …), so a forge can't make the bot fetch and publish internal pages.
# Set to true if one of your forges runs on your own network.
allow_internal_hosts: false
log_level: info           # debug, info, warn, error

summary:
  enabled: true
  time: "09:00"           # 24h clock
  timezone: Europe/Lisbon # IANA name
  skip_if_empty: false    # don't post when nothing changed

releases:
  enabled: true
  download_assets: true
  max_asset_size: 2GB     # larger assets are skipped (0 = unlimited)
  include_prereleases: true
  # Retention (both optional, 0 = unlimited). Releases are ranked newest first; only the
  # newest keep_last are kept, and older ones are removed while the repository (git data +
  # releases) is larger than max_repo_size. The newest release is always kept.
  keep_last: 10
  max_repo_size: 2GB

# Read-only web file browser for storage_dir: download single files, or whole folders as zip.
http:
  enabled: true
  bind: 0.0.0.0
  port: 8080
  # Externally reachable URL (e.g. behind a reverse proxy); adds "Browse" links to !archivist status.
  public_url: ""
  # Optional HTTP basic auth (recommended if the archive is reachable from the internet).
  username: ""
  password: ""
  max_concurrent_zips: 2
  # Prometheus metrics at /metrics (protected by the basic auth above, if set).
  metrics: true
  # Add the file browser to the room as a widget (Element / SchildiChat; needs public_url, and the
  # bot needs permission to change widgets — Moderator by default).
  widget:
    enabled: true
    name: Archive
    pin: false            # true = show it at the top of the room for everyone
  # Live activity page at /live/: what each worker is doing right now, with progress bars,
  # and a feed of recent events. Updates itself; nothing is posted to the room.
  live: true
  # Adds the live page to the room as a second widget (needs public_url).
  activity_widget:
    enabled: true
    name: Archive activity
    pin: false            # both widgets pinned = side by side at the top

# Release APIs. github.com, gitlab.com, codeberg.org and a few other well-known hosts are detected
# automatically, and unknown hosts are probed for a Gitea/Forgejo or GitLab API.
# Add entries for tokens (higher rate limits / private repos) or self-hosted forges.
forges:
  - host: github.com
    type: github          # github | gitea (also Forgejo/Codeberg) | gitlab
    token: ""             # fine-grained PAT with read-only "Contents" access; strongly recommended
  # - host: git.example.org
  #   type: gitea
  #   token: ""
  # - host: github.mycorp.com
  #   type: github
  #   api_url: https://github.mycorp.com/api/v3
